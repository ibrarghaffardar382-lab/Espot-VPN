services:
  - type: web
    name: espot-vpn-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run build && (npm run db:push || true) && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: espot-vpn-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_PUBLIC_HOST
        sync: false

databases:
  - name: espot-vpn-db
    plan: free
    databaseName: espot_vpn
