<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div class="logo">E</div>
        <div>
          <div class="title">Espot VPN</div>
          <div class="sub" id="statusText">Disconnected</div>
        </div>
        <div class="status-dot" id="statusDot"></div>
      </header>

      <div id="error" class="error hidden"></div>

      <!-- Connected view -->
      <section id="connectedView" class="hidden">
        <div class="shield connected">
          <div class="shield-ring"></div>
          <div class="shield-icon">🛡️</div>
        </div>
        <div class="conn-meta">
          <div class="meta-row">
            <span class="meta-label">Account</span>
            <span class="meta-value" id="metaUser">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Location</span>
            <span class="meta-value" id="metaLocation">—</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">Connected</span>
            <span class="meta-value" id="metaTime">—</span>
          </div>
        </div>
        <button id="disconnectBtn" class="btn btn-danger">Disconnect</button>
      </section>

      <!-- Login view -->
      <section id="loginView">
        <div class="shield">
          <div class="shield-icon dim">🔒</div>
        </div>
        <form id="loginForm">
          <label>
            Backend URL
            <input id="backendUrl" type="url" placeholder="https://your-app.onrender.com" required />
          </label>
          <label>
            Username
            <input id="username" type="text" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button id="connectBtn" class="btn btn-primary" type="submit">Connect</button>
        </form>
      </section>

      <footer class="foot">Secured by Espot VPN</footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
